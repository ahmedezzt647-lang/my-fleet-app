<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تتبع أسطول السيارات</title>
  <style>
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #2563eb;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #ffffff;
      --accent-color: #10b981;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 4px solid var(--secondary-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏢 أسطول شركة [الهوادج]</h1>
    <div class="subtitle">نظام التتبع المباشر لمركبات الأسطول</div>
  </header>

</body>
</html>
